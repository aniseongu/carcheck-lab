name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only token by default; only the release job asks for write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CarCheckLab.apk

      - uses: actions/upload-artifact@v7
        with:
          name: CarCheckLab-apk
          path: dist/CarCheckLab.apk

  # Open-source emulator runner: install the APK and tap through the demo flow.
  demo-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: CarCheckLab-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run demo flow on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 .github/scripts/demo_smoke.py dist/CarCheckLab.apk smoke

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-smoke-screenshots
          path: smoke/
          if-no-files-found: ignore

  # Tag push (v*) publishes the APK to GitHub Releases after the smoke test passes.
  # The README links to releases/latest/download/CarCheckLab.apk, so the file name must stay the same.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, demo-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CarCheckLab-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/CarCheckLab.apk \
            --title "CarCheck Lab $GITHUB_REF_NAME" \
            --notes "Android 기기에서 CarCheckLab.apk를 받아 설치합니다. 로그인 화면의 'Try demo (no account)'를 누르면 서버 없이 둘러볼 수 있습니다. 디버그 서명 APK라 이전 버전이 설치돼 있으면 먼저 지운 뒤 설치합니다."

      # Browser demo on Appetize (REST API, no official CLI). Skipped when the token secret is not set.
      # Without APPETIZE_PUBLIC_KEY it creates the app once; set the printed publicKey as a repo variable
      # so later tags update the same share link.
      - name: Update Appetize browser demo
        if: ${{ env.APPETIZE_API_TOKEN != '' }}
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          apk_url="https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME/CarCheckLab.apk"
          body=$(jq -n --arg url "$apk_url" --arg note "CarCheck Lab $GITHUB_REF_NAME" \
            '{platform: "android", fileType: "apk", url: $url, note: $note}')
          endpoint="https://api.appetize.io/v1/apps${APPETIZE_PUBLIC_KEY:+/$APPETIZE_PUBLIC_KEY}"
          curl -sSf -X POST "$endpoint" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body" | jq '{publicKey, versionCode, updated}'
